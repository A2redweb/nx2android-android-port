name: build-apk
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: true
on:
  push: { branches: [main] }
  workflow_dispatch: {}
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Bundle proot and the Ubuntu rootfs
        run: |
          bash tools/fetch_proot.sh
          bash tools/fetch_rootfs.sh
      - name: The payload manifest must match the payload files
        run: |
          python3 tools/make_manifest.py
          git diff --exit-code app/src/main/assets/nx2a/payload/payload.json || { echo "payload.json is out of date: run  python3 tools/make_manifest.py --bump  and commit"; exit 1; }
      - name: Build
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"; export KS_FILE="$RUNNER_TEMP/release.jks"
            gradle --no-daemon assembleRelease
          else
            gradle --no-daemon assembleDebug
          fi
      - uses: actions/upload-artifact@v4
        with: { name: nx2android-apk, path: 'app/build/outputs/apk/**/*.apk' }
      - name: Publish the APK as the latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$(ls app/build/outputs/apk/*/*.apk | head -1)"
          cp "$APK" nx2android.apk
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest nx2android.apk --prerelease --target "$GITHUB_SHA" --title "nx2android (latest build)" --notes "Built from $GITHUB_SHA. Debug-signed unless the signing secrets are set."
