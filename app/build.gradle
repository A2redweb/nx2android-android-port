plugins { id 'com.android.application' }

android {
    namespace 'unknown.none.nx2android'
    compileSdk 35
    defaultConfig {
        applicationId 'unknown.none.nx2android'
        minSdk 27
        targetSdk 28            // must stay below 29: Android 10+ blocks running programs from app storage for newer targets (proot needs it)
        versionCode 1
        versionName '0.1.1'
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        release {
            if (System.getenv('KS_FILE')) {
                storeFile file(System.getenv('KS_FILE')); storePassword System.getenv('KS_PASS')
                keyAlias System.getenv('KS_ALIAS'); keyPassword System.getenv('KS_PASS')
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig System.getenv('KS_FILE') ? signingConfigs.release : signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += ['**/*.so'] } }
    androidResources { noCompress += ['bin'] }
    lint { abortOnError false; checkReleaseBuilds false }
}

dependencies { implementation 'androidx.core:core:1.13.1' }
